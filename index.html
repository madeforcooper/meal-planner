<style>
:root{
  color-scheme: light dark;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}

select.in::-ms-expand{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}

th{font-size:14px;color:var(--muted);font-weight:600}
td b{font-weight:700}

details{margin-top:6px}

.note{border-left:5px solid;border-radius:6px 16px 16px 6px;padding:12px 15px;margin:10px 0}
.note>b{display:block;margin-bottom:2px}
.note p{margin:0;font-size:16px}
.note.warn{background:var(--warnbg);border-color:var(--warn)}
.note.tip{background:var(--tipbg);border-color:var(--fresh)}
.note.ok{background:var(--okbg);border-color:var(--dry)}
.note.info{background:var(--soft);border-color:var(--treat)}
.fine{color:var(--muted);font-size:14px;margin-top:28px}
.sr{position:absolute;left:-9999px}
@media (max-width:480px){.homerow{grid-template-columns:1fr 92px auto}.tagline{display:none}}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#12262B;--muted:#55696F;--line:#CFDDD7;--primary:#145A50;--primary-ink:#fff;--dry:#1F7A6B;--fresh:#F2B134;--home:#E2634A;--treat:#8FA0A6;--warn:#B8412B;--warnbg:#FCEBE6;--tipbg:#FFF4D9;--okbg:#E1F3EC;--soft:#E3EEE9}

<script>
/* ---------- DATA ---------- */
const B=(n,s,min,max,t,g)=>({n,s,min,max,g,t:t?t.split(','):[]});

const commitFocus=()=>{const a=document.activeElement;if(a&&a!==document.body&&typeof a.blur==='function')a.blur();};
const amtTxt=(k,g)=>{const u=(k==='dry'||k==='pup')?S.dry.unit:k==='fresh'?S.fresh.unit:S.homeUnit;
  if(u==='cups'){const q=cups(g,unitG(k,'cups'));return `${fr(q)} ${q<=1?'cup':'cups'} (${fmt(g)} g)`;} if(u==='oz') return `${(g/OZ).toFixed(1)} oz`; return `${fmt(g)} g`;};
const nice=x=>x<50?Math.round(x):x<150?Math.round(x/5)*5:Math.round(x/10)*10;
const caR=x=>x>=2?Math.round(x*2)/2:Math.round(x*10)/10;
const convAmt=(k,x,from,to)=>{const g=x*unitG(k,from);return to==='cups'?Math.max(0.25,Math.round(g/unitG(k,'cups')*4)/4):to==='oz'?Math.round(g/OZ*100)/100:Math.round(g);};

/* ---------- AGE MODEL ---------- */
function lerp(knots,x){
  if(x<=knots[0][0]) return knots[0][1];
  for(let i=1;i<knots.length;i++){
    if(x<=knots[i][0]){const [x0,y0]=knots[i-1],[x1,y1]=knots[i];return y0+(y1-y0)*(x-x0)/(x1-x0);}
  }
  return knots[knots.length-1][1];
}
// energy factor (x resting energy) for growing puppies, easing smoothly down to the adult factor at maturity
function pupKnots(size,mat,adultF){
  return {
    toy:[[2,3.0],[3,3.0],[5.5,2.0],[mat,adultF]],
    small:[[2,3.0],[3,3.0],[5.5,2.0],[mat,adultF]],
    medium:[[2,3.0],[3,3.0],[6,2.0],[mat,adultF]],
    large:[[2,2.8],[3,2.8],[7,1.9],[mat,adultF]],
    giant:[[2,2.6],[3,2.6],[8,1.8],[mat,adultF]],
  }[size];
}
// typical share of adult weight reached at a given age in months
const GROWTH={
  toy:[[2,.28],[3,.40],[4,.52],[6,.75],[8,.88],[10,.97],[12,1]],
  small:[[2,.24],[3,.38],[4,.50],[6,.72],[8,.87],[10,.96],[12,1]],
  medium:[[2,.15],[3,.25],[4,.38],[6,.60],[9,.85],[12,.97],[14,1]],
  large:[[2,.12],[3,.22],[4,.33],[6,.55],[9,.78],[12,.90],[15,.97],[18,1]],
  giant:[[2,.10],[3,.18],[4,.28],[6,.47],[9,.70],[12,.85],[18,.95],[24,1]],
};

/* ---------- CALCULATION ---------- */
function profile(){
  const b=breed();
  const months=Math.max(1,(+S.ageY)*12+(+S.ageM));
  const mat={toy:10,small:12,medium:14,large:18,giant:24}[b.s];
  const sen={toy:10,small:10,medium:8,large:7,giant:6}[b.s]*12;
  const geriAt=sen+{toy:48,small:48,medium:36,large:30,giant:24}[b.s];
  const isPuppy=months<mat, isSenior=!isPuppy&&months>=sen, isGeri=isSenior&&months>=geriAt;
  const w=wKg(S.weight,S.wUnit), hasTgt=wKg(S.target,S.tUnit)>0, tgt=hasTgt?wKg(S.target,S.tUnit):w;
  const rer=x=>70*Math.pow(x,0.75);
  const act={low:0.85,normal:1,high:b.s==='giant'?1.15:1.25}[S.activity];
  const base=S.neutered==='yes'?1.6:1.8;
  const sizeAdj={toy:1.05,small:1,medium:1,large:0.95,giant:0.88}[b.s];
  const mer=x=>rer(x)*base*act*sizeAdj*(isSenior?0.9:1);
  let kcal, mode='maintain', idealW=w, noTarget=false, pupF=null, growth=null;
  if(isPuppy){
    pupF=lerp(pupKnots(b.s,mat,base*sizeAdj),months);
    kcal=rer(w)*pupF*({low:0.9,normal:1,high:1.1}[S.activity])*(S.shape==='over'?0.85:S.shape==='thin'?1.1:1);
    mode=S.shape==='over'?'lose':S.shape==='thin'?'gain':'maintain';
    if(hasTgt&&tgt>=w*0.95){const exp=lerp(GROWTH[b.s],months)*tgt;growth={expected:exp,ratio:exp>0?w/exp:1};}
  }else if(S.shape==='over'){
    mode='lose';
    if(tgt<w){idealW=tgt;kcal=rer(tgt);}
    else{noTarget=true;idealW=w*0.85;kcal=mer(w)*0.8;}
  }else if(S.shape==='thin'){
    mode='gain'; idealW=Math.max(tgt,w); kcal=mer(idealW);
  }else kcal=mer(w);
  kcal=r5(kcal);
  let meals;
  if(isPuppy){
    meals=months<4?4:months<6?3:((b.s==='toy'||b.s==='small')&&months<9?3:2);
    if(b.s==='toy') meals=months<6?4:3;
  }else meals=isGeri?3:(b.t.includes('toyHypo')?3:2);
  if(hasH('stomach','pancreatitis','bloat','ibd')) meals=Math.max(meals,3);
  if(S.health.has('diabetes')) meals=2;
  return {b,months,isPuppy,isSenior,isGeri,sen,geriAt,w,tgt,kcal,mode,idealW,noTarget,meals,mat,pupF,growth};
}

function homeAnalysis(){
  const r={tot:0,k:0,by:{meat:0,organ:0,dairy:0,carb:0,veg:0,fat:0},kby:{meat:0,organ:0,dairy:0,carb:0,veg:0,fat:0},lines:[]};
  if(!S.srcs.home||S.homeUnsure) return r;
  ING.forEach(i=>{
    if(!(i.id in S.home)) return;
    const g=num(S.home[i.id],0)*unitG('home',S.homeUnit); if(!g) return;
    const k=g*i.k/100;
    r.tot+=g; r.k+=k; r.by[i.c]+=g; r.kby[i.c]+=k; r.lines.push({i,g,k});
  });
  return r;
}

function calc(){
  const p=profile();
  const kd=num(S.dry.kcalkg,DEF_DRY_KCAL), kf=num(S.fresh.kcalkg,DEF_FRESH_KCAL);
  const dryG=S.srcs.dry&&!S.dry.unsure?num(S.dry.amt,0)*unitG('dry',S.dry.unit):0;
  const freshG=S.srcs.fresh&&!S.fresh.unsure?num(S.fresh.amt,0)*unitG('fresh',S.fresh.unit):0;
  const an=homeAnalysis();
  const dry=dryG*kd/1000, fresh=freshG*kf/1000, home=an.k;
  const treats=(parseFloat(S.treatPct)||0)*p.kcal;
  const total=dry+fresh+home+treats;
  const food=dry+fresh+home;
  const diff=total>0?(total-p.kcal)/p.kcal:0;
  return {...p,kd,kf,dryG,freshG,an,intake:{dry,fresh,home,treats,total,food},diff};
}

function defaultSplit(sel){
  // used when some amounts are unknown: complete foods carry the diet, homemade stays a topper if mixed
  const comp=sel.filter(k=>k!=='home'), w={};
  if(!comp.length){ w.home=1; return w; }
  if(sel.includes('home')){ w.home=0.25; comp.forEach(k=>w[k]=0.75/comp.length); }
  else comp.forEach(k=>w[k]=1/comp.length);
  return w;
}
function recommend(c){
  const sel=['dry','fresh','home'].filter(k=>S.srcs[k]);
  const treatRec=Math.min(c.intake.treats,0.10*c.kcal);
  const budget=c.kcal-treatRec;
  const rec={dry:0,fresh:0,home:0};
  const unknown=sel.filter(k=>!(c.intake[k]>0));
  let scale=null;
  if(sel.length&&(unknown.length||c.intake.food<=0)){
    const w=defaultSplit(sel); sel.forEach(k=>rec[k]=budget*w[k]);
  }else if(c.intake.food>0){
    scale=budget/c.intake.food;
    sel.forEach(k=>rec[k]=c.intake[k]*scale);
  }
  let pup=0;
  if(c.isPuppy&&rec.home>0.25*budget){
    const extra=rec.home-0.25*budget; rec.home-=extra;
    if(S.srcs.dry) rec.dry+=extra; else if(S.srcs.fresh) rec.fresh+=extra; else pup=extra;
  }
  return {sel,treatRec,budget,rec,scale,unknown,pup};
}

function bowlSVG(c){
  const segs=[{k:c.intake.dry,c:'var(--dry)'},{k:c.intake.fresh,c:'var(--fresh)'},{k:c.intake.home,c:'var(--home)'},{k:c.intake.treats,c:'var(--treat)'}];
  const cap=Math.max(c.kcal*1.35,c.intake.total*1.05);
  const top=40,bot=135,H=bot-top;
  let y=bot,rects='';
  segs.forEach(s=>{if(s.k<=0)return;const h=s.k/cap*H;y-=h;rects+=`<rect x="10" y="${y.toFixed(1)}" width="220" height="${h.toFixed(1)}" fill="${s.c}"/>`;});
  const ty=bot-c.kcal/cap*H;
  const d='M20 40H220C220 105 185 135 120 135C55 135 20 105 20 40Z';
  return `<svg viewBox="0 0 240 158" role="img" aria-label="Bowl showing current daily calories against the target of ${fmt(c.kcal)} kcal">
    <defs><clipPath id="bowlclip"><path d="${d}"/></clipPath></defs>
    <path d="${d}" fill="var(--soft)"/>
    <g clip-path="url(#bowlclip)"><g class="fillg">${rects}</g></g>
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <rect x="86" y="140" width="68" height="6" rx="3" fill="var(--ink)"/>
    <line x1="8" x2="232" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="44" y="${(ty-19).toFixed(1)}" width="152" height="17" rx="8.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="120" y="${(ty-7).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">daily target ${fmt(c.kcal)} kcal</text>
  </svg>`;
}

function updateTally(){
  const t=$('#tally'); if(!t) return;
  const c=calc();
  const cap=Math.max(c.kcal*1.25,c.intake.total*1.02);
  const seg=(k,col)=>k>0?`<i style="width:${(k/cap*100).toFixed(1)}%;background:${col}"></i>`:'';
  t.innerHTML=`${c.intake.total>0?`Feeding about <b>${fmt(c.intake.total)}</b> of <b>${fmt(c.kcal)}</b> kcal a day`:`${esc(nm())} needs about <b>${fmt(c.kcal)}</b> kcal a day`}
   <div class="tbar">${seg(c.intake.dry,'var(--dry)')}${seg(c.intake.fresh,'var(--fresh)')}${seg(c.intake.home,'var(--home)')}${seg(c.intake.treats,'var(--treat)')}<span class="tmark" style="left:${(c.kcal/cap*100).toFixed(1)}%"></span></div>`;
}

/* ----- advice ----- */
function buildAdvice(c,rc){
  const A=[]; const add=(t,h,p)=>A.push({t,h,p});
  const n=esc(nm()==='Your dog'?'Your dog':nm());
  const T=c.intake.total, d=c.diff, food=c.intake.food;
  const sel=rc.sel;

  if(T>0&&(rc.unknown.length===0||d>0.10)){
    if(Math.abs(d)<=0.10) add('ok','Calories are on target',`You\u2019re feeding about ${fmt(T)} kcal a day, close to the ${fmt(c.kcal)} kcal ${n==='Your dog'?'your dog':n} needs.`);
    else if(d>0&&c.mode==='gain') add('warn','Still thin on a generous amount',`You\u2019re already feeding about ${Math.round(d*100)}% above the target (${fmt(T)} vs ${fmt(c.kcal)} kcal), yet your dog is thin. Weigh the food to double-check the amounts, and ask your vet to check for worms, tick fever, dental pain or other illness before adding more.`);
    else if(d>0) add(d>0.25?'warn':'tip','Feeding more than needed',`You\u2019re feeding about ${Math.round(d*100)}% more than the target (${fmt(T)} vs ${fmt(c.kcal)} kcal). Move to the amounts in the table over about a week.${c.mode==='lose'?' This extra is likely behind the extra weight.':''}`);
    else if(c.mode==='lose') add('tip','No need to cut further',`Your current amount is lower than the weight-loss target, so don\u2019t cut more. If the weight isn\u2019t falling, weigh the food and check for hidden extras like scraps and chews.`);
    else add(c.mode==='gain'||d<-0.25?'warn':'tip','Feeding less than needed',`You\u2019re feeding about ${Math.round(-d*100)}% below the target (${fmt(T)} vs ${fmt(c.kcal)} kcal). Raise the amounts in the table gradually over a week.`);
  }else if(T<=0){
    add('info','No current amounts to compare','Without your current amounts, the plan gives a starting split of the daily target. For a week, weigh what you serve on a kitchen scale, then come back to compare.');
  }
  if(T>0&&rc.unknown.length){
    const nmap={dry:'dry food',fresh:'packed fresh food',home:'homemade meals'};
    const list=rc.unknown.map(k=>nmap[k]).join(' and ');
    add('info','Some amounts are missing',`You didn\u2019t give an amount for ${list}, so the comparison only counts the rest, and the table gives a starting split for ${list}. Weigh what you serve for a week to fine-tune it.`);
  }

  if(c.intake.treats>0.10*c.kcal+1){
    add('tip','Treats are above 10%',`Treats and extras are about ${Math.round(c.intake.treats/c.kcal*100)}% of the day\u2019s calories (roughly ${fmt(c.intake.treats)} kcal). Keep them to 10% or less, about ${fmt(0.1*c.kcal)} kcal, and use part of the regular meal as training treats.`);
  }

  const complete=(c.intake.dry+c.intake.fresh);
  const homeShare=T>0?c.intake.home/(c.intake.food||1):(S.srcs.home&&sel.length===1?1:0);
  const hasComplete=S.srcs.dry||S.srcs.fresh;

  if(S.srcs.dry) add('info','Dry food check','Look for \u201ccomplete and balanced\u201d on the bag, for the right life stage (puppy, adult, or large-breed puppy). Keep it airtight, cool and dry, and switch brands slowly over 7 to 10 days.');
  if(S.srcs.fresh) add('info','Fresh food check','Make sure the pack says \u201ccomplete and balanced.\u201d Some are toppers and not meant to be a whole diet. Follow the storage and \u201cuse within\u201d directions on the pack once it\u2019s opened, and don\u2019t leave a served portion out for more than 30 minutes in warm weather.');
  if(S.srcs.home&&hasComplete&&c.intake.food>0) add('tip','Mixing foods',`When you combine foods, count them together. If you add homemade food or fresh packs, cut the dry food so the total stays near ${fmt(c.kcal)} kcal. The table shows the adjusted amounts.`);

  if(S.srcs.home){
    const an=c.an;
    const needsSupp = !hasComplete || homeShare>0.25;
    if(needsSupp){
      add('warn','Add two powders to homemade meals',
        `${c.isPuppy?'Growing puppies need their bones to grow strong, and homemade meals can easily get the mix of minerals wrong, so a complete puppy food should be the main meal. ':''}Homemade meals are lovely, but they can\u2019t give your dog every vitamin and mineral on their own. A calcium (or bone meal) powder and a multivitamin made for home-cooked food fill the gaps, and the exact amounts are in the recipe. Please don\u2019t add extra calcium on your own, since more isn\u2019t better.`);
    }else if(S.srcs.home){
      add('ok','Homemade alongside complete food looks fine','Because most calories come from complete food, a smaller share of homemade food is fine. Keep it plain and cooked.');
    }
    if(an.tot>0){
      const p=x=>an.by[x]/an.tot;
      const animal=p('meat')+p('organ');
      if(animal===0&&p('dairy')===0) add('warn','No meat, egg or fish in the mix','Dogs do best with good-quality animal protein like meat, egg or fish. We build our recipes around meat, fish or egg, because that is the simplest way to cover everything your dog needs.');
      else if(animal<0.30&&p('dairy')<0.2) add('tip','Protein looks low',`Meat, egg and fish are only about ${Math.round(animal*100)}% of the homemade bowl by weight. Aim for roughly 40 to 50%.`);
      if(p('carb')>0.50) add('tip','Too much rice, roti or other carbs',`Carbs make up about ${Math.round(p('carb')*100)}% of the homemade bowl. Keep them under half and make up the difference with protein and vegetables.`);
      if(p('veg')<0.10) add('tip','Add some vegetables','Aim for roughly 10 to 25% of the bowl as cooked vegetables like pumpkin, carrot or beans, for fibre.');
      if(an.k>0&&an.kby.fat/an.k>0.15) add('tip','Too much ghee or oil',`Added fat gives about ${Math.round(an.kby.fat/an.k*100)}% of the homemade calories. Cut back, especially if your dog has pancreatitis or is overweight.`);
      if(p('organ')>0.05) add('tip','Liver is above 5% of the bowl','A little liver is great, but too much isn\u2019t good for dogs. Keep it to about 5% of the bowl, or serve it once or twice a week.');
      if(p('dairy')>0.15) add('tip','Lots of paneer or curd',`Dairy is about ${Math.round(p('dairy')*100)}% of the bowl. Many dogs have trouble digesting milk products, so watch for loose stools and keep dairy modest.`);
    }else if(S.homeUnsure){
      add('info','Homemade recipe suggested','Since you weren\u2019t sure of the amounts, use the homemade recipe in the best food section below as a balanced starting point.');
    }else{
      add('info','Add ingredients for a balance check','Enter the ingredients and grams for your homemade meals, and we\u2019ll check protein, carbs, vegetables and fat.');
    }
  }

  if(S.avoid.size){
    const nmz=AVOID.filter(([k])=>S.avoid.has(k)).map(([,l])=>l.toLowerCase()).join(', ');
    add('tip','Picky eater',`${n==='Your dog'?'Your dog':n} avoids ${nmz}. Stick to meal times, take the bowl away after 20 to 30 minutes, and go easy on treats and scraps, which make picky eating worse. If your dog refuses food for more than 24 to 48 hours, or loses weight, see your vet.`);
  }else if(S.eatsAny){
    add('info','Eats anything given','Dogs like this gain weight easily and swallow things they shouldn\u2019t. Keep measuring every meal, count treats, and keep onion, garlic, chocolate, grapes and bones out of reach.');
  }
  if(c.isPuppy){
    if(c.months<2) add('warn','Very young puppy','Puppies under 8 weeks should still be with their mother or on vet-guided weaning. Please check with a vet before using any of these amounts.');
    if(c.b.s==='large'||c.b.s==='giant') add('tip','Large-breed puppy tips','Choose a large-breed puppy food, which helps bones and joints grow at a steady pace, and keep your puppy slim. Growing too fast is hard on young joints. Please skip calcium supplements, because the right amount is already in the food.');
    if(c.growth){
      const r=c.growth.ratio, who=n==='Your dog'?'your puppy':n;
      if(r>1.3) add('warn','Growing faster than typical',`At this age, ${who} would usually weigh about ${wTxt(c.growth.expected)} (based on the adult weight you entered), and is ${wTxt(c.w)}. Fast growth stresses young joints, especially in bigger breeds. Stick to the target amounts, keep treats small, and ask your vet to check body condition.`);
      else if(r<0.7) add('tip','Smaller than typical for this age',`At this age, ${who} would usually weigh about ${wTxt(c.growth.expected)} (based on the adult weight you entered), and is ${wTxt(c.w)}. Make sure the portions are fully eaten, check worming is up to date, and ask your vet if the gap persists.`);
      else add('ok','Growth looks on track',`${who==='your puppy'?'Your puppy':who} is close to the usual weight for this age (about ${wTxt(c.growth.expected)}). Weigh every 2 weeks and re-run this plan monthly.`);
    }
    add('info','Growing puppy',`Feed ${c.meals} meals a day at regular times. Weigh every 2 weeks, and re-run this calculator as your puppy grows because needs change quickly.`);
  }else{
    if(S.neutered==='yes') add('info','Neutered or spayed dogs need fewer calories','Neutering or spaying lowers energy needs by roughly a quarter and often increases appetite. We\u2019ve used a lower factor, so weigh your dog monthly.');
    else add('info','Not neutered or spayed','The plan uses a slightly higher energy factor for intact dogs. Talk to your vet about the right time for neutering or spaying if it\u2019s on your mind, and then re-run this calculator.');
    if(c.isGeri) add('info','Very senior dog',`At this age, appetite and muscle often fade. Feed ${c.meals} smaller meals, warm or soften the food if chewing is hard, and don\u2019t cut calories further if weight is dropping. See your vet every 6 months, and sooner if your dog eats less, drinks more or gets thin.`);
    if(c.isSenior) add('info','Senior dog','Calories are trimmed about 10%, but seniors still need good protein to hold on to muscle. Watch for weight loss, which can signal an illness.');
  }
  return A;
}

function lifeStageHtml(c){
  const span=m=>m>=24?`${Math.round(m/12)} years`:`${m} month${m===1?'':'s'}`;
  const stages=[['Puppy',c.isPuppy],['Adult',!c.isPuppy&&!c.isSenior],['Senior',c.isSenior&&!c.isGeri],['Very senior',c.isGeri]];
  const pills=stages.map(([l,on])=>`<span class="stg${on?' on':''}">${l}</span>`).join('');
  const who=nm()==='Your dog'?'your dog':esc(nm());
  let title,txt;
  if(c.isPuppy){
    title='Life stage: puppy';
    txt=`Adult at about ${c.mat} months (in about ${span(Math.max(1,Math.round(c.mat-c.months)))}). Calories per kilo are highest now and ease down smoothly as growth slows, so amounts change every few weeks. Re-run this plan monthly, and move to adult food gradually over 7 to 10 days when ${who} reaches adulthood.`;
  }else if(!c.isSenior){
    title='Life stage: adult';
    txt=`Senior from about ${span(c.sen)} old (in about ${span(Math.max(1,Math.round(c.sen-c.months)))}). Until then, keep weight steady, and re-run this plan if weight, activity or neutering status changes.`;
  }else if(!c.isGeri){
    title='Life stage: senior';
    txt=`Calories are trimmed about 10%, with good protein to protect muscle. Very senior from about ${span(c.geriAt)} old, when smaller, more frequent meals help. See your vet every 6 to 12 months.`;
  }else{
    title='Life stage: very senior';
    txt='Smaller, more frequent meals, softer food if needed, and a vet check every 6 months. Watch for weight loss, which can be a sign of illness.';
  }
  return `<div class="card"><b>${title}</b><div class="stages">${pills}</div><p style="margin:10px 0 0">${txt}</p></div>`;
}

    <div class="legend">${leg.length?leg.map(l=>`<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join(''):'<span>Add amounts on the food step to see the bowl fill</span>'}</div>
  </div>`;
}
function verdictHtml(c,rc,lines,leg){
  const who=nm()==='Your dog'?'your dog':esc(nm()), Who=nm()==='Your dog'?'Your dog':esc(nm());
  const T=c.intake.total,K=c.kcal,pct=T>0?Math.round(T/K*100):0,d=c.diff,unk=rc.unknown.length;
  const treats=c.intake.treats, allow=0.10*K, tEx=Math.max(0,treats-allow), fEx=Math.max(0,c.intake.food-rc.budget), tShare=(tEx+fEx)>0?tEx/(tEx+fEx):0;
  const tUnit=K<400?5:K<900?10:20, nT=Math.max(1,Math.round(tEx/tUnit));
  let tone='info',head,body;
  if(c.intake.food<=0){head='Here\u2019s how much to feed';body=`You weren\u2019t sure how much ${who} eats now, so use the amounts below as a starting point. Weigh what you serve on a kitchen scale for a week, then compare.`;}
  else if(unk&&d<=0.10){head='Partly compared';body=`From the amounts you entered, ${Who} gets about ${fmt(nice(T))} kcal a day (${pct}% of the ${fmt(K)} kcal target). Foods marked not sure aren\u2019t counted, so use the amounts below as your starting point.`;}
  else if(Math.abs(d)<=0.10&&tEx>0.03*K){tone='tip';head='Right total, swap treats for meals';body=`${Who} gets about ${fmt(nice(T))} kcal a day, close to the ${fmt(K)} kcal target, but ${Math.round(treats/K*100)}% of it comes from treats and extras (up to 10% is the sweet spot). Move about ${fmt(nice(tEx))} kcal from treats into meals: keep treats to about ${fmt(nice(allow))} kcal a day and feed the meal amounts below.`;}
  else if(Math.abs(d)<=0.10){tone='ok';head='Right amount';body=`${Who} gets about ${fmt(nice(T))} kcal a day, close to the ${fmt(K)} kcal target (${pct}%). Keep going, and re-check in 2 to 4 weeks.`;}
  else if(d>0&&c.mode==='gain'){tone='warn';head='More than the target, yet still thin';body=`${Who} gets about ${fmt(nice(T))} kcal a day (${pct}% of the ${fmt(K)} kcal target) but is still thin. Weigh the food to double-check, and ask your vet to check for worms, tick fever, dental pain or other illness before adding more.`;}
  else if(d>0){
    tone=d>0.25?'warn':'tip';
    const lose=c.mode==='lose'?' This extra is likely behind the extra weight.':'';
    const unkTxt=unk?' Foods marked not sure aren\u2019t counted, so the real amount may be higher.':'';
    const treatsOver=tEx>=0.02*K, mealsOver=fEx>=0.02*K;
    const treatStep=`cut the treats from about ${fmt(nice(treats))} to about ${fmt(nice(allow))} kcal a day (roughly ${nT} fewer small treat${nT>1?'s':''} of about ${tUnit} kcal each)`;
    if(treatsOver&&!mealsOver){
      head='Time to trim the treats';
      body=`${Who}\u2019s meals are about right. The extra comes from treats and extras: about ${fmt(nice(treats))} kcal a day, or ${Math.round(treats/K*100)}% of the day\u2019s food, while up to 10% (about ${fmt(nice(allow))} kcal) is the sweet spot. Cut the treats back by about ${fmt(nice(tEx))} kcal, roughly ${nT} small treat${nT>1?'s':''} of about ${tUnit} kcal each, and keep the meals about the same.${lose}${unkTxt}`;
    }else if(treatsOver&&mealsOver){
      head='Trim the treats first, then the portions';
      body=`The extra comes from two places. First, ${treatStep}. Then trim the meals to the amounts below, because they are about ${fmt(nice(fEx))} kcal above the plan even after the treats are cut. Do both over about a week.${lose}${unkTxt}`;
    }else{
      head='Time to trim portions';
      body=`${Who}\u2019s meals add up to about ${fmt(nice(c.intake.food))} kcal a day, ${fmt(nice(fEx))} kcal more than the plan. Trim the meals to the amounts below, over about a week.${lose}${unkTxt}`;
    }
  }
  else if(c.mode==='lose'){head='No need to cut further';body=`${Who} gets about ${fmt(nice(T))} kcal a day, under the ${fmt(K)} kcal weight-loss target, so don\u2019t cut more. If the weight isn\u2019t falling, weigh the food and check for hidden extras like scraps and chews.`;}
  else{tone=pct<75?'warn':'tip';head='Time to add a little more';body=`${Who} gets about ${fmt(nice(T))} kcal a day, ${100-pct}% less than the ${fmt(K)} kcal target. Add about ${fmt(nice(K-T))} kcal a day to the meals, gradually over a week.`;}
  const gauge=c.intake.food>0?`<div class="gauge" role="img" aria-label="Current feeding is ${pct}% of the target"><div class="zones"><div class="zone low"></div><div class="zone ok"></div><div class="zone high"></div></div><i class="mk" style="left:${Math.max(1.5,Math.min(98.5,(pct-50))).toFixed(1)}%"></i></div><div class="gl"><span>Too little</span><span>Right amount</span><span>Too much</span></div>`:'';
  const chg=(l)=>{
    if(!(l.now>0)) return `feed <b>${amtTxt(l.k,l.rec)}</b> a day`;
    const dl=l.rec-l.now;
    if(Math.abs(dl)<=Math.max(0.03*l.now,3)) return `already right: <b>${amtTxt(l.k,l.rec)}</b> a day`;
    return `from ${amtTxt(l.k,l.now)} to <b>${amtTxt(l.k,l.rec)}</b> a day (${amtTxt(l.k,nice(Math.abs(dl)))} ${dl<0?'less':'more'})`;
  };
  const items=lines.map(l=>`<li><b>${l.label}:</b> ${chg(l)}</li>`);
  if(c.intake.treats>0.10*K+1){const ti=`<li><b>Treats and extras:</b> cut from about ${fmt(nice(c.intake.treats))} to about ${fmt(nice(allow))} kcal a day (roughly ${nT} fewer small treats)</li>`; items.unshift(ti);}
  const used=[];
  if(S.srcs.dry) used.push(`${fmt(c.kd)} kcal per kg for the dry food`);
  if(S.srcs.fresh) used.push(`${fmt(c.kf)} kcal per kg for the fresh food`);
  if(S.srcs.home) used.push(c.an.tot>0?'the homemade ingredients you listed':'a typical homemade mix');
  return `<div class="bowlcard verdict v-${tone}">
    <span class="vchip ${tone}">${head}</span>
    <p class="vbody">${body}</p>
    ${gauge}
    ${items.length?`<p class="vh">What to feed each day</p><ul class="lines">${items.join('')}</ul>`:''}
    <p class="hint dep">These amounts depend on the energy in the food you use. We used ${used.join(', ')}. If your food is richer or lighter, the grams change, so check the bag, pack or ingredients and update them if needed. <button type="button" class="linkbtn" data-go="2">Change foods</button></p>
  </div>`;
}

function renderPlan(){
  const c=calc(), rc=recommend(c);
  const b=c.b, n=nm();
  const stage=c.isPuppy?`puppy, ${c.months<24?c.months+' months':Math.floor(c.months/12)+' years'}`:c.isSenior?'senior':'adult';
  const stageDesc=`${esc(b.n)}, ${S.sex}, ${stage}, ${wTxt(c.w)}${c.isPuppy?'':S.neutered==='yes'?(S.sex==='female'?', spayed':', neutered'):(S.sex==='female'?', not spayed':', not neutered')}`;
  const perMeal=r5(c.kcal/c.meals);
  const dryAlone=nice(c.kcal/(c.kd/1000));

  /* rows */
  const rows=[], lines=[];
  const rulesR=recipeRules(c); fixR(c,rulesR);
  const rcp=(!rulesR.blocked&&!rulesR.noOptions)?recipeCalc(c,rc):null;
  const mealsDiv=x=>x/c.meals;
  if(S.srcs.dry){
    const rg=nice(rc.rec.dry/(c.kd/1000));
    lines.push({k:'dry',label:'Dry food',short:'dry food',now:c.dryG,rec:rg});
    rows.push({c:'var(--dry)',t:'Dry food',nowG:c.dryG,nowTxt:c.dryG?`${gS(c.dryG)}<small>${cups(c.dryG)} cups</small>`:`<small>${S.dry.unsure?'not sure':'not entered'}</small>`,recTxt:`<b>${gS(rg)}</b><small>about ${cups(rg)} cups a day</small>`,mealTxt:`${gS(nice(mealsDiv(rg)))}`});
  }
  if(S.srcs.fresh){
    const rg=nice(rc.rec.fresh/(c.kf/1000));
    lines.push({k:'fresh',label:'Packed fresh food',short:'fresh food',now:c.freshG,rec:rg});
    rows.push({c:'var(--fresh)',t:'Packed fresh food',nowTxt:c.freshG?`${gS(c.freshG)}<small>${cups(c.freshG,FRESH_CUP_G)} cups</small>`:`<small>${S.fresh.unsure?'not sure':'not entered'}</small>`,recTxt:`<b>${gS(rg)}</b><small>about ${cups(rg,FRESH_CUP_G)} cups a day</small>`,mealTxt:`${gS(nice(mealsDiv(rg)))}`});
  }
  if(S.srcs.home){
    let rg,detail='';
    const hs=c.intake.home>0?rc.rec.home/c.intake.home:null;
    if(rcp){
      rg=recipeAt(c,rc.rec.home).W;
      detail='<small>cooked weight, from the recipe above</small>';
    }else if(c.an.tot>0&&hs!==null){
      rg=c.an.tot*hs;
      detail=`<details><summary>Amount of each ingredient</summary><ul>${c.an.lines.map(l=>`<li>${l.i.n}: ${gS(l.g)} \u2192 <b>${gS(l.g*hs)}</b></li>`).join('')}</ul></details>`;
    }else{
      rg=rc.rec.home/(TEMPLATE_KCAL100/100);
      detail=`<details><summary>Starter bowl by weight</summary><ul><li>Cooked meat, egg or fish: ${gS(rg*0.5)}</li><li>Sweet potato or rice: ${gS(rg*0.3)}</li><li>Cooked vegetables: ${gS(rg*0.2)}</li></ul></details>`;
    }
    lines.push({k:'home',label:'Homemade food',short:'homemade food',now:c.an.tot,rec:rg});
    rows.push({c:'var(--home)',t:'Homemade meals',nowTxt:c.an.tot?`${gS(c.an.tot)}<small>${fmt(c.an.k)} kcal</small>`:`<small>${S.homeUnsure?'not sure':'not entered'}</small>`,recTxt:`<b>${gS(rg)}</b><small>about ${fmt(rc.rec.home)} kcal a day</small>${detail}`,mealTxt:`${gS(nice(mealsDiv(rg)))}`});
  }
  if(rc.pup>0){
    const gp=nice(rc.pup/(PUP_KCAL/1000));

    rows.push({c:'var(--dry)',t:'Complete puppy food (dry)',nowTxt:'<small>not entered</small>',recTxt:`<b>${gS(gp)}</b><small>about ${cups(gp)} cups a day</small>`,mealTxt:`${gS(nice(mealsDiv(gp)))}`});
  }
  if(c.intake.treats>0||true){
    rows.push({c:'var(--treat)',t:'Treats and extras',nowTxt:c.intake.treats?`${fmt(c.intake.treats)} kcal`:'none',recTxt:`<b>up to ${fmt(0.1*c.kcal)} kcal</b><small>10% of the day</small>`,mealTxt:'training use'});
  }

  /* legend */
  const leg=[];
  if(c.intake.dry>0) leg.push(['var(--dry)',`Dry ${fmt(c.intake.dry)} kcal`]);

  /* status line */

  }

  if(rc.unknown.length&&c.intake.total>0) status='From the amounts you entered, that is about '+fmt(c.intake.total)+' kcal a day. Foods marked not sure are not counted.';

  /* weight card */
  let weightHtml='';
  const w=c.w, bmid=(b.min+b.max)/2;

  }else{
    weightHtml=`<p>Typical healthy range for this breed: <b>${rngTxt(b.min,b.max)}</b>. ${esc(n==='Your dog'?'Your dog':n)} weighs ${wTxt(w)}. Body shape matters more than the number, so use the rib test.</p>`;
    if(c.mode==='lose'){
      if(c.noTarget) weightHtml+=`<p>Your target weight isn\u2019t below the current weight, so we\u2019ve trimmed calories by about 20%. Go back and set a lower target for a firmer plan.</p>`;
      else{
        const lo=Math.ceil((w-c.idealW)/(w*0.02)), hi=Math.ceil((w-c.idealW)/(w*0.01));
        weightHtml+=`<p>Plan: reach <b>${wTxt(c.idealW)}</b>. A safe pace is 1 to 2% of body weight a week, so expect about <b>${lo} to ${hi} weeks</b>. Weigh every 2 weeks, and ask your vet to check if loss is faster than that.</p>`;
      }
    }
    if(c.mode==='gain') weightHtml+=`<p>The target is set for ${wTxt(c.idealW)}. Raise portions gradually, and have your vet check for worms, tick fever and other causes of thinness before assuming it\u2019s just food.</p>`;
  }

  /* advice + notes */
  const adv=buildAdvice(c,rc);
  const order={warn:0,tip:1,ok:2,info:3};
  adv.sort((a,b)=>order[a.t]-order[b.t]);
  const DROP=['Calories are on target','Feeding more than needed','Still thin on a generous amount','No need to cut further','Feeding less than needed','No current amounts to compare','Some amounts are missing'];
  const advHtml=adv.filter(a=>!DROP.includes(a.h)).map(a=>`<div class="note ${a.t}"><b>${a.h}</b><p>${a.p}</p></div>`).join('');

  const bt=[...new Set(b.t)].map(t=>BREED_NOTES[t]).filter(Boolean);
  if(c.isPuppy&&!(b.s==='large'||b.s==='giant')){}
  const breedHtml=bt.map(x=>`<div class="note info"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('');

  const hs=[...S.health].filter(h=>HEALTH_NOTES[h]);
  const serious=HEALTH.filter(h=>h.serious&&S.health.has(h.id));
  const healthHtml=hs.length?hs.map(h=>`<div class="note info"><b>${HEALTH_NOTES[h][0]}</b><p>${HEALTH_NOTES[h][1]}</p></div>`).join(''):'';

  const bestHtml=bestFoodSection(c);
  return `
  <div class="hero">
    <h2>${poss().replace(/^your dog\u2019s$/,'Your dog\u2019s')} meal plan</h2>
    <p>${stageDesc}</p>
    <div class="big">${fmt(c.kcal)}<small>kcal a day</small></div>

    <p class="qty">That is about ${lines.map(l=>`<b>${amtTxt(l.k,l.rec)} ${l.short}</b>`).join(' + ')} a day.</p>
  </div>

  ${serious.length?`<div class="note tip" style="margin-top:14px"><b>A plan to share with your vet</b><p>With ${serious.map(x=>x.l.toLowerCase()).join(', ')}, your vet may fine-tune the calories or the food. Bring this plan along as a great starting point${S.health.has('pregnant')?' (pregnancy and nursing need extra energy, which your vet will add)':''}.</p></div>`:''}

  ${verdictHtml(c,rc,lines,leg)}

  ${recipeTopSection(c,rc)}

  ${bowlCardHtml(c,leg)}

  ${lifeStageHtml(c)}

  <section class="sec"><h3>How much to feed</h3>
    <div class="tblwrap" id="feedTable"><table>

    </table></div>

  </section>

  ${breedHtml?`<section class="sec"><h3>For ${esc(b.n.split(' (')[0])}</h3>${breedHtml}</section>`:''}
  ${healthHtml?`<section class="sec"><h3>Health notes</h3>${healthHtml}</section>`:''}

  <div class="actions">

    <button class="btn ghost" type="button" data-savedog>Save ${n=='Your dog'?'my dog':esc(n)}\u2019s data</button>

  <details class="method"><summary>How we calculate this, and our sources</summary><div class="inner">
    <ul>
      <li><b>Resting energy</b> = 70 \u00d7 (weight in kg)<sup>0.75</sup>.</li>
      <li><b>Puppies:</b> about 3 times resting energy at 2 to 3 months, easing down smoothly to about 2 times mid-growth, then to the adult factor at maturity (10 months for toy breeds up to 24 months for giant breeds). Large and giant breeds start lower (2.6 to 2.8) to slow growth. Activity adjusts the amount by up to 10%.</li>
      <li><b>Adults:</b> 1.6 times (neutered or spayed) or 1.8 times (not), then \u00d7 0.85 for easygoing, \u00d7 1.25 for very active dogs, and a size adjustment (toy +5%, large \u22125%, giant \u221212%). Seniors get \u221210%.</li>
      <li><b>Weight loss</b> uses resting energy at the target weight. <b>Weight gain</b> uses maintenance at the target weight.</li>
      <li><b>Homemade recipe:</b> cooked protein, grain and vegetables in a 2:2:1 ratio by weight (4:3:3 for weight loss), a little coconut oil, ground pumpkin seeds for essential fats (about 10 g per 1,000 kcal), and a calcium or bone meal powder chosen for each recipe so calcium and phosphorus are balanced. Every recipe is checked against the adult dog guidelines for protein, fat, essential fats, calcium and phosphorus, using standard food-composition values. A multivitamin and omega-3 are added at meals.</li>
      <li><b>Packed foods</b> use typical values (kibble ${DEF_DRY_KCAL.toLocaleString()}, fresh ${DEF_FRESH_KCAL.toLocaleString()} kcal per kg) unless you enter your own. A cup is counted as ${CUP_G} g of kibble or ${FRESH_CUP_G} g of fresh food.</li>
    </ul>
    <p>Based on the WSAVA <a href="https://wsava.org" target="_blank" rel="noopener">Global Nutrition Guidelines</a>, the NRC <i>Nutrient Requirements of Dogs and Cats</i> (2006), the <a href="https://www.aafco.org" target="_blank" rel="noopener">AAFCO</a> dog food nutrient profiles and the <a href="https://www.fediaf.org" target="_blank" rel="noopener">FEDIAF</a> guidelines.</p>
    <p>Treat these numbers as a starting point: adjust every 2 to 4 weeks based on body shape and weight, and your vet can fine-tune them any time. Nothing you enter leaves your device.</p>
  </div></details>`;
}

/* ---------- BEST FOOD ---------- */
const PROT = {
  chickth:{n:'Chicken thigh, boneless and skinless',s:'Chicken thigh',k:190,yield:0.75,oil:4},
  chickbr:{n:'Chicken breast, boneless and skinless',s:'Chicken breast',k:165,yield:0.75,oil:8},

const CARB = {

const VEGS = [
  {id:'sweetp',n:'Sweet potato',sh:0.35,k:90,f:1.0},
  {id:'carrot',n:'Carrot',sh:0.25,k:35,f:1.10},
  {id:'pumpkin',n:'Pumpkin',sh:0.20,k:20,f:1.30},

const VEG = {n:'Mixed vegetables (sweet potato, carrot, pumpkin, green beans)',k:VEGS.reduce((a,v)=>a+v.sh*v.k,0),f:VEGS.reduce((a,v)=>a+v.sh*v.f,0)};
// per 100 g cooked: protein g, fat g, calcium mg, phosphorus mg, linoleic acid g (approximate food-composition values)
const NUT = {
  chickth:{p:25,f:9,ca:12,ph:190,la:1.7}, chickbr:{p:31,f:3.6,ca:15,ph:228,la:0.7}, fish:{p:22,f:4.2,ca:40,ph:230,la:0.15}, mutton:{p:28,f:13,ca:15,ph:190,la:0.4},
  rice:{p:2.7,f:0.3,ca:10,ph:43,la:0.1}, brownrice:{p:2.7,f:1,ca:10,ph:103,la:0.3}, quinoa:{p:4.4,f:1.9,ca:17,ph:152,la:0.9},
  sweetp:{p:2,f:0.2,ca:38,ph:54,la:0.05}, carrot:{p:0.8,f:0.2,ca:30,ph:30,la:0.07}, pumpkin:{p:0.7,f:0.1,ca:15,ph:30,la:0.03}, beans:{p:1.9,f:0.3,ca:55,ph:38,la:0.07},
};
const SEED = {n:'Ground pumpkin seeds',k:559,p:30,f:49,ca:46,ph:1233,la:20.7,perKcal:10}; // grams per 1,000 kcal, for essential fats and minerals
const MINERAL = {calcarb:{ca:0.40,ph:0},bone:{ca:0.24,ph:0.11}};                         // grams per gram of powder
const MIN_ADULT = {p:45,f:13.8,la:2.8,ca:1.25,ph:1.0};                                    // per 1,000 kcal (AAFCO adult maintenance)
function vegList(){
  const L=VEGS.filter(v=>!(v.id==='sweetp'&&S.avoid.has('sweetp')));
  const tot=L.reduce((a,v)=>a+v.sh,0);
  return L.map(v=>({...v,sh:v.sh/tot}));
}
const PUP_KCAL = 3900; // kcal per kg of a typical puppy kibble, used only when no complete food is chosen
const HEALTH_FOOD = {
  skin:'A single-protein or limited-ingredient food with omega-3 can help, and so can flea and mite control.',
  constipation:'Add moisture and a little cooked pumpkin or other fibre.',
  ibd:'A special diet chosen by your vet is usually advised, for example one made with a protein your dog hasn\u2019t eaten before.',

  cushings:'A lower-fat, vet-guided diet is usually advised.',
  cancer:'Your vet will tailor a high-quality, energy-dense diet.',

  breathing:'Keep calories controlled, since leanness helps breathing.',
  epilepsy:'Ask your vet about a steady diet, and about a prescription MCT-enriched diet. Keep salt intake consistent if your dog takes potassium bromide.',

  pregnant:'A puppy or \u201call life stages\u201d food, with amounts set by your vet.'
};
const R = {protein:null,carb:'rice',oil:'coconut',days:1,open:null};
const rg = x=>x>=100?Math.round(x/5)*5:Math.round(x);
const fr = x=>{const q=Math.round(x*4)/4,w=Math.floor(q),f=q-w;const s={0:'',0.25:'\u00bc',0.5:'\u00bd',0.75:'\u00be'}[f];return ((w?w:'')+(s||''))||'\u00bc';};
const tspSeed = g=>g/3<0.2?'a small pinch':fr(g/3)+' tsp';
const tspTxt = g=>g/4.5<0.2?'a small pinch':fr(g/4.5)+' tsp';

function foodGuide(c){
  const b=c.b,t=b.t,g=[],small=b.s==='toy'||b.s==='small',big=b.s==='large'||b.s==='giant';
  const stage=c.isPuppy?(big?'large-breed puppy':small?'small-breed puppy':'puppy'):c.isSenior?'senior':(small?'small-breed adult':big?'large-breed adult':'adult');
  g.push(`<b>Life stage:</b> choose a food labelled \u201ccomplete and balanced\u201d for a <b>${stage}</b>.${c.isPuppy&&big?' Large-breed puppy foods help bones and joints grow at a steady pace.':''}${small&&!c.isSenior?' Small kibble and a higher energy density suit small mouths and fast metabolisms.':''}${c.isSenior?' Look for moderate calories, good-quality protein to protect muscle, and added omega-3.':''}`);
  g.push(`<b>Protein:</b> the first ingredient should be a named animal protein such as chicken, fish, egg or mutton. As a guide, ${c.isPuppy?'puppies do best on about 28% protein or more':'adults do well on roughly 22 to 30%'} protein on the label.`);
  if(c.mode==='lose') g.push('<b>Weight loss:</b> a weight-management food (lower fat, higher protein and fibre) keeps your dog fuller on fewer calories. You can also keep the current food and just measure it.');
  if(c.mode==='gain') g.push('<b>Weight gain:</b> an energy-dense food (often 3,800 kcal per kg or more) lets your dog eat smaller meals and still gain.');
  if(t.includes('skin')||hasH('allergy','skin')) g.push('<b>Skin and coat:</b> a single-protein or limited-ingredient food with omega-3 can help. Change only one thing at a time.');
  if(t.includes('sensitive')||hasH('stomach','ibd')) g.push('<b>Digestion:</b> choose an easily digestible food with moderate fat and prebiotic fibre.');
  if(t.includes('joint')||hasH('joint','dysplasia','spine')||c.isSenior) g.push('<b>Joints:</b> look for omega-3 and glucosamine or chondroitin on the label.');
  if(t.includes('brachy')) g.push('<b>Flat face:</b> kibble shaped for flat-faced breeds is easier to pick up.');
  if(t.includes('purine')) g.push('<b>Dalmatian:</b> pick a low-purine food and avoid organ meats and sardines.');
  if(t.includes('fatsens')) g.push('<b>Low fat:</b> this breed is prone to pancreatitis, so choose a lower-fat food.');
  if(t.includes('toyHypo')) g.push('<b>Tiny dog:</b> an energy-dense small-breed food, fed in small, frequent meals.');
  HEALTH.filter(h=>S.health.has(h.id)&&HEALTH_FOOD[h.id]).forEach(h=>g.push(`<b>${h.l}:</b> ${HEALTH_FOOD[h.id]}`));
  if(S.avoid.size){const nmz=AVOID.filter(([k])=>S.avoid.has(k)).map(([,l])=>l.toLowerCase());g.push(`<b>Picky eater:</b> pick a food without ${nmz.join(', ')}, and keep the ingredient list simple. Try a different texture (wet, fresh or a tasty topper) and warm it slightly to boost the smell.`);}
  if(S.eatsAny) g.push('<b>Eats anything:</b> taste won\u2019t limit your choice, so choose on nutrition alone. These dogs rarely stop eating on their own, so keep measuring.');
  g.push('<b>Fresh-cooked packs:</b> choose ones labelled complete and balanced for the right life stage, and check the kcal per kg on the pack so you can use the amounts in the table above.');
  g.push('<b>Skip:</b> vague \u201cmeat and animal by-products\u201d, artificial colours and added sugar. Check with your vet before choosing a grain-free formula.');
  return g;
}

function recipeRules(c){
  const serious=HEALTH.filter(h=>h.serious&&S.health.has(h.id));
  const purine=c.b.t.includes('purine');
  const avoidProt={chickth:'chicken',chickbr:'chicken',fish:'fish',mutton:'mutton'};
  const allowed=Object.keys(PROT).filter(k=>!(purine&&(k==='fish'||k==='mutton'))&&!S.avoid.has(avoidProt[k]));
  const carbs=Object.keys(CARB).filter(k=>!S.avoid.has(CARB_AVOID[k]));
  const oils=c.b.t.includes('fatsens')?[]:['coconut'];
  return {blocked:serious.length>0,serious,allowed,carbs,oils,noOptions:(!allowed.length||!carbs.length)};
}
function fixR(c,rules){
  const lean=c.b.t.includes('fatsens')||c.b.t.includes('purine')||hasH('stomach','ibd');
  if(rules.allowed.length&&!rules.allowed.includes(R.protein)) R.protein=(lean&&rules.allowed.includes('chickbr'))?'chickbr':(rules.allowed.includes('chickth')?'chickth':rules.allowed[0]);
  if(rules.carbs.length&&!rules.carbs.includes(R.carb)) R.carb=rules.carbs.includes('rice')?'rice':rules.carbs[0];
  R.oil='coconut';
  if(![1,2,3,7].includes(R.days)) R.days=1;
  if(R.open===null) R.open=true;
}
// recipe for a given calorie target; every weight is rounded to an easy number and all totals come from the rounded weights
function recipeAt(c,target){
  const P=PROT[R.protein],C=CARB[R.carb];
  const noVeg=S.avoid.has('veg');
  const ratio=c.mode==='lose'?(noVeg?[.40,.40,.20]:[.40,.30,.30]):(noVeg?[.40,.50,.10]:[.40,.40,.20]);
  const oilPer=c.b.t.includes('fatsens')?0:P.oil;
  const oil=Math.round(oilPer*target/1000*2)/2;
  const seedG=caR(SEED.perKcal*target/1000), seedK=seedG*SEED.k/100;
  const vl=vegList(), vk=vl.reduce((a,v)=>a+v.sh*v.k,0);
  const dens=ratio[0]*P.k+ratio[1]*C.k+ratio[2]*vk;
  const W0=(target-oil*8.8-seedK)/dens*100;
  // round each ingredient to a practical weight, then take every total from the rounded weights so all numbers agree
  const meat=nice(ratio[0]*W0), carb=nice(ratio[1]*W0), vegT=ratio[2]*W0;
  const vegs=vl.map(v=>({v,cooked:nice(vegT*v.sh)}));
  const veg=vegs.reduce((a,x)=>a+x.cooked,0);
  const W=nice(meat+carb+veg);
  const Kh=meat*P.k/100+carb*C.k/100+vegs.reduce((a,x)=>a+x.cooked*x.v.k/100,0)+oil*8.8+seedK;
  const raw={meat:nice(meat/P.yield),carb:nice(carb*C.f),vegs:vegs.map(x=>nice(x.cooked*x.v.f))};
  const rawVeg=raw.vegs.reduce((a,b)=>a+b,0);
  const absorbed=Math.max(0,carb-raw.carb);
  const water=nice(absorbed+0.2*(raw.meat+rawVeg));
  // nutrients for the day (grams), from the rounded weights
  const tot={p:0,f:0,ca:0,ph:0,la:0};
  const add=(n,g)=>{tot.p+=n.p*g/100;tot.f+=n.f*g/100;tot.ca+=n.ca*g/100000;tot.ph+=n.ph*g/100000;tot.la+=n.la*g/100;};
  add(NUT[R.protein],meat); add(NUT[R.carb],carb); vegs.forEach(x=>add(NUT[x.v.id],x.cooked)); add(SEED,seedG);
  tot.f+=oil; tot.la+=oil*0.018;
  // calcium source chosen for this recipe: calcium carbonate if its phosphorus is already good, bone meal if it is low
  const kk=Kh/1000, caF=tot.ca/kk, pF=tot.ph/kk;
  let src,g;
  if(pF>=1.15){src='calcarb';g=(Math.max(1.4,1.25*pF)-caF)/MINERAL.calcarb.ca*kk;}
  else{src='bone';const caT=Math.max(1.4,(1.08*pF-0.495*caF)/0.505);g=(caT-caF)/MINERAL.bone.ca*kk;}
  g=caR(Math.max(0,g));
  const ca=(tot.ca+g*MINERAL[src].ca)/kk, ph=(tot.ph+g*MINERAL[src].ph)/kk;
  const nut={pr:tot.p/kk,fat:tot.f/kk,la:tot.la/kk,ca,ph,ratio:ca/ph};
  const pass=nut.pr>=MIN_ADULT.p&&nut.fat>=MIN_ADULT.f&&nut.la>=MIN_ADULT.la&&nut.ca>=MIN_ADULT.ca&&nut.ph>=MIN_ADULT.ph&&nut.ratio>=1&&nut.ratio<=2;
  return {P,C,ratio,target,Kh,oil,seedG,W,cooked:{meat,carb,veg,vegs},raw,absorbed,water,broth:nice(target/100*10),mineral:{src,g},nut,pass};
}
// the full-day recipe (puppies: a homemade share of about a quarter of the food)
function recipeCalc(c,rcm){ return recipeAt(c,c.isPuppy?(S.srcs.home?Math.min(rcm.rec.home,0.25*rcm.budget):0.25*rcm.budget):rcm.budget); }

function recipeCard(c,rules,rcm){
  const rc=recipeCalc(c,rcm), meals=c.meals, days=R.days;
  const wd=c.mode==='lose'?c.idealW:c.w;
  const chips=(key,items,cur)=>`<div class="chips">${items.map(([v,l])=>`<button type="button" class="chip" data-ropt="${key}" data-val="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</div>`;
  const homeDiet=!c.isPuppy;
  const row=(n,perDay,batch,cls='')=>`<tr class="${cls}"><td>${n}</td><td><b>${perDay}</b></td>${days>1?`<td>${batch}</td>`:''}</tr>`;
  const sub=t=>`<tr class="subh"><td colspan="${days>1?3:2}">${t}</td></tr>`;
  const ml=x=>S.wUnit==='lb'||usPref()?`${fmt(x)} ml<small>about ${(x/240).toFixed(1)} cups</small>`:`${fmt(x)} ml`;
  const water=rc.water, broth=rc.broth;
  const oilG=rc.oil;
  const carbPrep={rice:'Wash the rice until the water runs clear.',brownrice:'Wash the brown rice until the water runs clear.',quinoa:'Rinse the quinoa well under running water for a minute.'}[R.carb];
  const slow=R.carb==='brownrice';
  const hasSP=rc.cooked.vegs.some(x=>x.v.id==='sweetp');
  const others=rc.cooked.vegs.filter(x=>x.v.id!=='sweetp').map(x=>x.v.n.toLowerCase());
  const othersTxt=others.length>1?others.slice(0,-1).join(', ')+' and '+others[others.length-1]:others.join('');
  const rows=[
    sub('Cook together in one pot'),
    row(rc.P.n,gS(rc.raw.meat),gS(rc.raw.meat*days)),
    row(rc.C.n,gS(rc.raw.carb),gS(rc.raw.carb*days)),
    ...rc.cooked.vegs.map((x,i)=>row(x.v.n,gS(rc.raw.vegs[i]),gS(rc.raw.vegs[i]*days))),
    row('Water',ml(water),ml(water*days)),
    row('Unsalted chicken or vegetable broth <i>(optional)</i>',`up to ${ml(broth)}`,`up to ${ml(broth*days)}`,'opt'),
  ];
  rows.push(sub('Stir in after cooking'));
  if(rc.oil>0.2) rows.push(row(OILS[R.oil].n,`${oilG} g<small>${tspTxt(rc.oil)}</small>`,`${Math.round(rc.oil*days*2)/2} g<small>${tspTxt(rc.oil*days)}</small>`));
  rows.push(row(SEED.n,`${rc.seedG} g<small>${tspSeed(rc.seedG)}</small>`,`${caR(rc.seedG*days)} g<small>${tspSeed(rc.seedG*days)}</small>`));
  if(homeDiet){
    rows.push(sub('Mix in at each meal'));
    rows.push(row(rc.mineral.src==='bone'?'Bone meal powder (pet or food grade)':'Calcium carbonate powder or finely ground, baked eggshell',`${rc.mineral.g} g<small>${tspTxt(rc.mineral.g)}</small>`,`${caR(rc.mineral.g*days)} g`));
    rows.push(row('Multivitamin and mineral powder for home-cooked dog food',`per label for ${wTxt(wd)}`,`per label`));
  }
  rows.push(row('<b>Cooked food, ready to serve</b>',`${gS(rc.W)}`,`${gS(rc.W*days)}`,'tot'));
  const steps=[
    `${carbPrep} ${hasSP?'Wash and cube the sweet potato. ':''}Cut the ${rc.P.s.toLowerCase()} into chunks, and chop the ${othersTxt} small.`,
    `Put the protein, grain and vegetables in <b>one pot or pressure cooker</b> with the water${rc.absorbed>1?` (the ${rc.C.s.toLowerCase()} soaks up about ${fmt(nice(rc.absorbed))} ml of it)`:''}. For extra flavour you can use unsalted broth for part of the water.`,
    `Cook until the meat is cooked right through with no pink, and the grain and vegetables are soft. That takes about ${slow?'35 to 40':'20 to 25'} minutes of simmering, or ${slow?'5 to 6':'3 to 4'} whistles in a pressure cooker.`,
    `Boil off or drain any extra water, so the food is moist but not soupy. Shred the meat, remove any bones (especially for fish), mash everything together, and let it cool.`,
    `Weigh the finished food: <b>one day should come to about ${gS(rc.W)}</b>.${' Stir in the '+(rc.oil>0.2?'coconut oil and ':'')+'ground pumpkin seeds, then'} divide it into <b>${days*meals} meal portions</b> (${meals} a day for ${days} day${days>1?'s':''}), about <b>${gS(nice(rc.W/meals))}</b> each.`,
    days>3?`Keep 3 days\u2019 worth in the fridge and <b>freeze the rest</b>. Thaw in the fridge overnight.`:`Keep it covered in the fridge and use within 3 days, or freeze portions for up to 3 months.`,
    `Serve lukewarm.${homeDiet?' At each meal, mix in the '+(rc.mineral.src==='bone'?'bone meal':'calcium')+' powder and the multivitamin.':''} Remove uneaten food after 30 minutes.`
  ];
  const notes=[];
  notes.push('No salt, spices, onion, garlic, masala or sugar, ever. Never feed cooked bones.');
  notes.push('Broth is optional. Use it only if it is unsalted and made without onion or garlic. It adds almost no calories, so the amounts above stay the same.');
  if(R.carb==='quinoa') notes.push('Rinse quinoa really well and cook it fully, because its natural coating can upset tummies if it\u2019s left on.');
  if(c.mode==='lose') notes.push('This version uses more vegetables and less carb to keep your dog full on fewer calories.');
  if(c.b.t.includes('bloat')) notes.push('Deep-chested breeds: split the day into 2 or 3 meals, and rest for an hour after eating.');
  if(c.b.t.includes('toyHypo')&&!c.isPuppy) notes.push('Tiny dogs do best on 3 small meals a day. Don\u2019t let them skip meals.');
  if(c.b.t.includes('skin')||hasH('allergy','skin')) notes.push('Itchy skin or allergies: pick one protein your dog hasn\u2019t eaten much, and stay with it for 8 to 12 weeks.');
  if(rc.oil>0.2){
    if(['chickbr','fish','mutton'].includes(R.protein)) notes.push('Coconut oil adds energy, but it doesn\u2019t give the healthy fats that keep skin and coat in good shape, and this leaner meat has very little too. Ask your vet whether a small amount of another oil would help. Start with half the oil for the first few days, since coconut oil can loosen stools.');
    else notes.push('Coconut oil adds energy and shine. Start with half the amount for the first few days, since it can loosen stools. Chicken thigh already provides the healthy fats your dog needs.');
  }
  if(c.b.t.includes('fatsens')) notes.push('No added oil for this breed, because it is prone to pancreatitis and fat is hard on the pancreas. The omega-3 fish oil under supplements covers the essential fats, and your vet can advise further.');
  if(R.protein==='fish') notes.push('Use boneless fillets and check twice for bones. Skip fish if it is an allergy trigger.');
  if(S.avoid.has('veg')) notes.push('Your dog avoids vegetables, so they are kept to 10 to 20% of the bowl. Cook them very soft, then blend or mash them into the mix so they are hidden, and add a little more each week.');
  if(S.avoid.size) notes.push('Picky eater tips: warm the food slightly, stir in a spoonful of the cooking water, and introduce any new food a teaspoon at a time. Offer the meal for 20 to 30 minutes and then take it away, and don\u2019t top up with treats. Call your vet if your dog refuses food for more than 24 hours.');
  if(S.eatsAny) notes.push('Eats anything: great for variety. Rotate the protein every few weeks, keep measuring because these dogs rarely stop on their own, and keep onion, garlic, chocolate, grapes and bones out of reach.');
  if(homeDiet&&!c.b.t.includes('purine')&&!S.avoid.has('liver')) notes.push('Once or twice a week, swap about 5% of the meat for cooked chicken liver. Please don\u2019t do it more often, because too much liver isn\u2019t good for dogs.');
  const suppHome=homeDiet
    ?`<div class="note warn"><b>Add the powders to every meal</b><p>Homemade meals are lovely, but they can\u2019t give your dog every vitamin and mineral on their own. The ${rc.mineral.src==='bone'?'bone meal':'calcium'} powder in the table was chosen to balance this exact recipe, and the multivitamin fills in the rest, so please don\u2019t skip them. They keep bones, teeth, skin and coat healthy. Look for a multivitamin and mineral powder made for homemade dog food that lists zinc, iodine, vitamin D and vitamin E. Please don\u2019t add extra calcium on your own, since more isn\u2019t better.</p></div>`
    :`<div class="note ok"><b>No extra powders needed</b><p>${c.isPuppy?'This is a share of the day\u2019s food alongside a complete puppy food, which already has everything your puppy needs for growing.':'This is a small share of the day\u2019s food, and the complete food already has the vitamins and minerals your dog needs.'} Adding more could throw things off balance.</p></div>`;
  const ck=rc.nut, f1=x=>(Math.round(x*10)/10);
  const checkHtml=homeDiet?(rc.pass?`<div class="note ok"><b>Nutrition check passed</b><p>With the powders added, this recipe meets the adult dog guidelines for protein, fat, essential fats, calcium and phosphorus.</p><details><summary>See the numbers</summary><ul><li>Protein: ${Math.round(ck.pr)} g per 1,000 kcal (guideline minimum ${MIN_ADULT.p} g)</li><li>Fat: ${Math.round(ck.fat)} g (minimum ${MIN_ADULT.f} g)</li><li>Essential fat (linoleic acid): ${f1(ck.la)} g (minimum ${MIN_ADULT.la} g)</li><li>Calcium: ${f1(ck.ca)} g (minimum ${MIN_ADULT.ca} g) and phosphorus: ${f1(ck.ph)} g (minimum ${MIN_ADULT.ph} g)</li><li>Calcium to phosphorus: ${f1(ck.ratio)} to 1 (guideline 1 to 1 up to 2 to 1)</li></ul></details></div>`:`<div class="note tip"><b>Try another protein or grain for the best balance</b><p>One of the other choices above will give your dog an even better balance of nutrients.</p></div>`):'';
  const partTip=homeDiet?`<p class="hint">Only feeding part of this recipe? Use the same share of the powders: half of the recipe gets half of each powder.</p>`:'';
  const per=nice(rc.W/meals);
  let line1,line2;
  if(c.isPuppy){
    const pupG=nice(Math.max(0,rcm.budget-rc.Kh)/((S.srcs.dry?c.kd:PUP_KCAL)/1000));
    line1=`<b>Homemade share:</b> feed about <b>${gS(rc.W)}</b> of this recipe a day, which is about ${Math.max(5,Math.round(rc.Kh/rcm.budget*20)*5)}% of the food.`;
    line2=`<b>With complete puppy food:</b> feed about <b>${gS(pupG)}</b> of puppy food (dry) a day for the rest.`;
  }else{
    line1=`<b>Only this recipe:</b> feed about <b>${gS(rc.W)}</b> of cooked food a day, in ${meals} meals of about <b>${gS(per)}</b>.`;
    if(S.srcs.home&&(S.srcs.dry||S.srcs.fresh)){
      const A=recipeAt(c,rcm.rec.home).W;
      const parts=[]; if(S.srcs.dry) parts.push(`<b>${gS(nice(rcm.rec.dry/(c.kd/1000)))}</b> of dry food`); if(S.srcs.fresh) parts.push(`<b>${gS(nice(rcm.rec.fresh/(c.kf/1000)))}</b> of fresh food`);
      line2=`<b>Mixed with ${S.srcs.dry&&S.srcs.fresh?'dry and fresh food':S.srcs.dry?'dry food':'fresh food'}:</b> feed about <b>${gS(A)}</b> of this recipe plus ${parts.join(' and ')} a day.`;
    }else{
      const A=recipeAt(c,0.5*rcm.budget).W;
      line2=`<b>Mixed with dry food (half and half):</b> feed about <b>${gS(A)}</b> of this recipe plus <b>${gS(nice(0.5*rcm.budget/(c.kd/1000)))}</b> of dry food a day.`;
    }
  }
  const intro=`<p style="margin-top:6px">${c.isPuppy?`This recipe makes the <b>homemade share</b> of ${nm()==='Your dog'?'your puppy':esc(nm())}\u2019s day: about <b>${gS(rc.W)} cooked</b>, around ${fmt(nice(rc.Kh))} kcal, which is about ${Math.max(5,Math.round(rc.Kh/rcm.budget*20)*5)}% of the food. A complete puppy food covers the rest.`:`This recipe makes <b>one full day</b> of homemade food for ${nm()==='Your dog'?'your dog':esc(nm())}: about <b>${gS(rc.W)} cooked</b>, around ${fmt(nice(rc.Kh))} kcal.`}</p>
      <p class="vh" style="margin-bottom:2px">How to feed it</p>
      <ul class="lines two"><li>${line1}</li><li>${line2}</li></ul>`;
  return `<details class="recipe" ${R.open?'open':''}>
    <summary>Homemade one-pot recipe for ${esc(nm()==='Your dog'?'your dog':nm())}</summary>
    <div class="inner">
      ${c.isPuppy?'<div class="note warn"><b>Puppies: homemade food as a share of the meal</b><p>Growing puppies need a carefully balanced mix of nutrients for strong bones, and homemade meals can easily miss it. A complete puppy food does this for you, so it works best as most of the diet (about three quarters). Homemade food makes a lovely other share, for variety and taste.</p></div>':''}
      ${intro}
      <div class="optrow"><span class="lab">Protein</span>${chips('protein',rules.allowed.map(k=>[k,PROT[k].s]),R.protein)}</div>
      <div class="optrow"><span class="lab">Grain (carb)</span>${chips('carb',rules.carbs.map(k=>[k,CARB[k].s]),R.carb)}</div>
      <div class="optrow"><span class="lab">Cook enough for</span>${chips('days',[[1,'1 day'],[2,'2 days'],[3,'3 days'],[7,'7 days (freeze)']],R.days)}</div>
      <div class="tblwrap"><table>
        <thead><tr><th>Ingredient (raw weight)</th><th>${days>1?'Per day':'For one day'}</th>${days>1?`<th>${days}-day batch</th>`:''}</tr></thead>
        <tbody>${rows.join('')}</tbody></table></div>
      <h3 style="font-size:18px;margin:18px 0 6px">How to cook it</h3>
      <ol class="steps2">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>
      ${partTip}
      ${suppHome}
      ${checkHtml}
      ${notes.map(t=>`<div class="note info"><p>${t}</p></div>`).join('')}
      <p class="hint">Follow the amounts and powders exactly, weigh your dog every 2 to 4 weeks, and adjust if the body shape changes. Mention the homemade diet at your yearly vet check, so your vet knows what your dog eats.</p>
    </div>
  </details>`;
}

function suppGeneral(c,rules){
  const L=[]; const add=(h,p)=>L.push(`<div class="note info"><b>${h}</b><p>${p}</p></div>`);
  const t=c.b.t, wd=c.mode==='lose'?c.idealW:c.w;
  if(rules.blocked) L.push(`<div class="note tip"><b>Supplements: let your vet guide you</b><p>With ${rules.serious.map(s=>s.l.toLowerCase()).join(', ')}, your vet can say which supplements help and which amounts suit your dog.</p></div>`);
  if(c.isPuppy){
    add('Puppies: keep it simple','A complete puppy food already has everything your puppy needs, so there\u2019s no need for extra calcium or vitamins (extra calcium can actually harm growing joints, especially in big breeds). Fish oil with DHA is optional, and your vet can suggest the right amount for the product you choose.');
  }else{
    add('Omega-3 fish oil, daily',`About <b>${Math.max(25,r5(50*wd))} mg of EPA + DHA a day</b>, roughly 50 mg per kg of body weight. Read the label for EPA + DHA per capsule or pump, not total fish oil. It supports skin, coat, joints and heart. Give it with a meal.`);
    if(t.includes('joint')||hasH('joint','dysplasia','spine')||c.isSenior) add('Joint support','A vet-approved glucosamine and chondroitin (or green-lipped mussel) product, dosed on the label for your dog\u2019s weight. Benefits are modest, and keeping your dog lean matters more.');
    if(t.includes('skin')||hasH('allergy','skin')) add('Skin and coat','Omega-3 is the main supplement. Give it daily for 8 to 12 weeks before judging the result, and ask your vet about a higher dose.');
    if(t.includes('sensitive')||hasH('stomach','ibd')) add('Probiotic','A dog-specific probiotic for 2 to 4 weeks can help when changing food or after an upset stomach. Don\u2019t use human or sweetened yogurt as a substitute.');
    if(c.isSenior) add('Senior check-ups','Ask your vet about blood tests every 6 to 12 months, since needs change with age.');
  }
  return `<h3 style="font-size:18px;margin:20px 0 6px">Daily supplements</h3>
    <div class="note ok"><b>Feeding a complete and balanced food?</b><p>Then there\u2019s no need to add calcium or a multivitamin. More isn\u2019t better, and extra can upset the balance.</p></div>${L.join('')}`;
}

function recipeBody(c,rcm){
  const rules=recipeRules(c); fixR(c,rules); rcm=rcm||recommend(c);
  const nope=(!rules.blocked&&rules.noOptions)?`<div class="note tip"><b>Let\u2019s find a protein and a grain your dog likes</b><p>Our homemade recipe uses one protein (${Object.keys(PROT).map(k=>PROT[k].s.toLowerCase()).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}) and one grain (${Object.keys(CARB).map(k=>CARB[k].s.toLowerCase()).join(', ')}). ${c.b.t.includes('purine')?'Chicken is the best one to try first for a Dalmatian. ':''}Your calories and daily amounts above already work with any food, so you are all set for today. To unlock the recipe, offer tiny tastes of a food from the list, cooked plain and served slightly warm, or untick one in step 3. <button type="button" class="linkbtn" data-go="2">Change foods</button></p></div>`:'';
  const recipe=rules.blocked
    ?`<div class="note warn"><b>Best food for ${nm()==='Your dog'?'your dog':esc(nm())} right now: a diet picked by your vet</b><p>With ${rules.serious.map(s=>s.l.toLowerCase()).join(', ')}, the best way to feed is a diet made for exactly that, and your vet can choose one. The plan above already works out the right number of calories. Once you have the food, enter its energy (kcal per kg, printed on the pack) in step 3 and the exact daily amount will show up in \u201cWhat to feed each day\u201d. <button type="button" class="linkbtn" data-go="2">Add my vet\u2019s food</button></p></div>`
    :(nope||recipeCard(c,rules,rcm));
  return recipe;
}
function recipeTopSection(c,rcm){

}

function bestFoodSection(c){
  const n=nm()==='Your dog'?'your dog':esc(nm());

    <div class="card"><b>What to look for in a ready-made food</b><ul class="chk">${foodGuide(c).map(x=>`<li>${x}</li>`).join('')}</ul></div>
